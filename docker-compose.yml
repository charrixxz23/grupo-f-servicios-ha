name: semestral-ha
services:
  api:
    build: ./api
    environment:
      PORT: 3000
      MYSQL_NODES: mysql1:3306,mysql2:3306,mysql3:3306
      MYSQL_USER: ha_app
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:?Copy .env.example to .env and set secrets}
      MYSQL_DATABASE: ha_lab
      REDIS_SENTINELS: sentinel1:26379,sentinel2:26379,sentinel3:26379
      REDIS_MASTER_NAME: ha-cache
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    depends_on:
      sentinel1: {condition: service_healthy}
      mysql1: {condition: service_healthy}
      mysql2: {condition: service_healthy}
      mysql3: {condition: service_healthy}
      db-setup: {condition: service_completed_successfully}
    networks: [backend]
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 384m
    mem_reservation: 128m
    pids_limit: 128
    oom_score_adj: 250
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 2s
      retries: 10
      start_period: 20s
  lb:
    image: nginx:1.27-alpine
    ports: ["127.0.0.1:${API_PORT:-8082}:8080"]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api: {condition: service_healthy}
    networks: [frontend, backend]
    restart: unless-stopped
    cpus: 0.5
    mem_limit: 128m
    mem_reservation: 48m
    pids_limit: 64
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health || exit 1"]
      interval: 5s
      timeout: 2s
      retries: 5
  assets:
    image: nginx:1.27-alpine
    ports: ["127.0.0.1:8081:80"]
    volumes: ["./nginx/nginx.conf:/etc/nginx/nginx.conf:ro", "./nginx/assets.conf:/etc/nginx/conf.d/default.conf:ro", "./assets:/usr/share/nginx/html:ro"]
    networks: [frontend]
    restart: unless-stopped
    cpus: 0.25
    mem_limit: 96m
    mem_reservation: 32m
    pids_limit: 64
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 2s
      retries: 3

  redis-primary:
    image: redis:7.4-alpine
    command: ["sh", "-ec", "exec redis-server --appendonly yes --appendfsync everysec --requirepass \"$$REDIS_PASSWORD\" --masterauth \"$$REDIS_PASSWORD\" --io-threads 2 --io-threads-do-reads yes"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    volumes: [redis-primary-data:/data]
    networks: [backend, redis-internal]
    restart: unless-stopped
    cpus: 0.5
    mem_limit: 384m
    mem_reservation: 128m
    pids_limit: 128
    oom_score_adj: 300
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping 2>/dev/null | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis-replica1:
    image: redis:7.4-alpine
    command: ["sh", "-ec", "exec redis-server --appendonly yes --appendfsync everysec --requirepass \"$$REDIS_PASSWORD\" --masterauth \"$$REDIS_PASSWORD\" --replicaof redis-primary 6379 --io-threads 2"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    volumes: [redis-replica1-data:/data]
    networks: [backend, redis-internal]
    depends_on: [redis-primary]
    restart: unless-stopped
    cpus: 0.5
    mem_limit: 384m
    mem_reservation: 128m
    pids_limit: 128
    oom_score_adj: 350
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping 2>/dev/null | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis-replica2:
    image: redis:7.4-alpine
    command: ["sh", "-ec", "exec redis-server --appendonly yes --appendfsync everysec --requirepass \"$$REDIS_PASSWORD\" --masterauth \"$$REDIS_PASSWORD\" --replicaof redis-primary 6379 --io-threads 2"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    volumes: [redis-replica2-data:/data]
    networks: [backend, redis-internal]
    depends_on: [redis-primary]
    restart: unless-stopped
    cpus: 0.5
    mem_limit: 384m
    mem_reservation: 128m
    pids_limit: 128
    oom_score_adj: 350
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping 2>/dev/null | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  sentinel1: &sentinel
    image: redis:7.4-alpine
    command: ["sh", "-ec", "cp /config/sentinel.conf /tmp/sentinel.conf; echo \"requirepass $$REDIS_PASSWORD\" >> /tmp/sentinel.conf; echo \"sentinel auth-pass ha-cache $$REDIS_PASSWORD\" >> /tmp/sentinel.conf; exec redis-server /tmp/sentinel.conf --sentinel"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    volumes: ["./redis/sentinel.conf:/config/sentinel.conf:ro"]
    networks: [backend, redis-internal]
    depends_on:
      redis-primary: {condition: service_healthy}
    restart: unless-stopped
    cpus: 0.2
    mem_limit: 96m
    mem_reservation: 32m
    pids_limit: 64
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -p 26379 -a \"$$REDIS_PASSWORD\" ping 2>/dev/null | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
  sentinel2:
    <<: *sentinel
  sentinel3:
    <<: *sentinel

  mysql1:
    image: mysql:8.4
    command: ["--server-id=101", "--report-host=mysql1", "--log-bin=mysql-bin", "--binlog-format=ROW", "--gtid-mode=ON", "--enforce-gtid-consistency=ON", "--log-replica-updates=ON", "--binlog-checksum=NONE", "--plugin-load-add=group_replication.so", "--loose-group-replication-start-on-boot=OFF", "--loose-group-replication-local-address=mysql1:3306", "--loose-group-replication-group-seeds=mysql1:3306,mysql2:3306,mysql3:3306", "--loose-group-replication-group-name=aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee", "--loose-group-replication-single-primary-mode=ON", "--loose-group-replication-enforce-update-everywhere-checks=OFF", "--loose-group-replication-communication-stack=MYSQL"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
      MYSQL_ROOT_HOST: "%"
    volumes: [mysql1-data:/var/lib/mysql]
    networks: [backend, db-internal]
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 1536m
    mem_reservation: 512m
    pids_limit: 256
    oom_score_adj: -500
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 90s
  mysql2:
    image: mysql:8.4
    command: ["--server-id=102", "--report-host=mysql2", "--log-bin=mysql-bin", "--binlog-format=ROW", "--gtid-mode=ON", "--enforce-gtid-consistency=ON", "--log-replica-updates=ON", "--binlog-checksum=NONE", "--plugin-load-add=group_replication.so", "--loose-group-replication-start-on-boot=OFF", "--loose-group-replication-local-address=mysql2:3306", "--loose-group-replication-group-seeds=mysql1:3306,mysql2:3306,mysql3:3306", "--loose-group-replication-group-name=aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee", "--loose-group-replication-single-primary-mode=ON", "--loose-group-replication-enforce-update-everywhere-checks=OFF", "--loose-group-replication-communication-stack=MYSQL"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
      MYSQL_ROOT_HOST: "%"
    volumes: [mysql2-data:/var/lib/mysql]
    networks: [backend, db-internal]
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 1536m
    mem_reservation: 512m
    pids_limit: 256
    oom_score_adj: -500
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 90s
  mysql3:
    image: mysql:8.4
    command: ["--server-id=103", "--report-host=mysql3", "--log-bin=mysql-bin", "--binlog-format=ROW", "--gtid-mode=ON", "--enforce-gtid-consistency=ON", "--log-replica-updates=ON", "--binlog-checksum=NONE", "--plugin-load-add=group_replication.so", "--loose-group-replication-start-on-boot=OFF", "--loose-group-replication-local-address=mysql3:3306", "--loose-group-replication-group-seeds=mysql1:3306,mysql2:3306,mysql3:3306", "--loose-group-replication-group-name=aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee", "--loose-group-replication-single-primary-mode=ON", "--loose-group-replication-enforce-update-everywhere-checks=OFF", "--loose-group-replication-communication-stack=MYSQL"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
      MYSQL_ROOT_HOST: "%"
    volumes: [mysql3-data:/var/lib/mysql]
    networks: [backend, db-internal]
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 1536m
    mem_reservation: 512m
    pids_limit: 256
    oom_score_adj: -500
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 90s
  db-setup:
    build: ./mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
      MYSQL_APP_PASSWORD: ${MYSQL_APP_PASSWORD:?Set MYSQL_APP_PASSWORD}
    volumes: ["./mysql/cluster.js:/scripts/cluster.js:ro"]
    command: ["printf '%s\\n' \"$$MYSQL_ROOT_PASSWORD\" | exec mysqlsh --uri=root@mysql1:3306 --passwords-from-stdin --js -f /scripts/cluster.js"]
    depends_on:
      mysql1: {condition: service_healthy}
      mysql2: {condition: service_healthy}
      mysql3: {condition: service_healthy}
    networks: [backend, db-internal]
    cpus: 0.5
    mem_limit: 512m
    pids_limit: 128
    restart: "no"
  loadgen:
    image: node:22-alpine
    profiles: [tools]
    working_dir: /work
    volumes: ["./tools:/work:ro", "./results:/results"]
    environment:
      TARGET: http://lb:8080
      DURATION: ${LOAD_DURATION:-30s}
      CONCURRENCY: ${LOAD_CONCURRENCY:-25}
      REPLICAS: "3"
    networks: [frontend, backend]
    cpus: 1.0
    mem_limit: 384m
    pids_limit: 128
  pressure-test:
    image: polinux/stress-ng:latest
    profiles: [tools]
    command: ["--vm", "1", "--vm-bytes", "32M", "--vm-keep", "--timeout", "20s"]
    mem_limit: 128m
    mem_reservation: 32m
    cpus: 0.5
    pids_limit: 32
    networks: [backend]

networks:
  frontend: {driver: bridge}
  backend: {driver: bridge, internal: true}
  redis-internal: {driver: bridge, internal: true}
  db-internal: {driver: bridge, internal: true}
volumes:
  redis-primary-data:
  redis-replica1-data:
  redis-replica2-data:
  mysql1-data:
  mysql2-data:
  mysql3-data:
